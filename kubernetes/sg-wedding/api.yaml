apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-wedding-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sg-wedding-api
  template:
    metadata:
      labels:
        app: sg-wedding-api
    spec:
      nodeSelector:
        workload: sg-wedding
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ocir-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: sg-wedding-api:replace-me
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -Djava.io.tmpdir=/tmp"
          envFrom:
            - secretRef:
                name: database-credentials
                optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database-ca
              mountPath: /etc/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-ca
          secret:
            secretName: database-credentials
            optional: true
            items:
              - key: DB_SSL_ROOT_CERT
                path: root.crt
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sg-wedding-api
spec:
  type: ClusterIP
  selector:
    app: sg-wedding-api
  ports:
    - name: http
      port: 8080
      targetPort: http
