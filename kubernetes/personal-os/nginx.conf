server {
    listen 8080;
    server_name personal-os.tech www.personal-os.tech;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # Preserve /api/; the Java app owns this prefix. Only HTTPS is exposed by the LB.
    # The webhook callback path contains a shared secret.
    location /api/strava/webhook/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://personal-os-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://personal-os-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React client-side routes fall back to the built index document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
