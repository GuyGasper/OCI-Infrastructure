name: Deploy OCI infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Infrastructure target"
        required: true
        type: choice
        default: personal-os
        options:
          - personal-os
          - wedding
          - shared
          - all
      apply:
        description: "Apply the plans (clear this for plan only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and optionally apply
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_id: ${{ vars.OCI_COMPARTMENT_ID }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_namespace: ${{ vars.OCI_NAMESPACE }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Configure OCI API credentials
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 0600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' \
            '[DEFAULT]' \
            "user=$OCI_USER_OCID" \
            "fingerprint=$OCI_FINGERPRINT" \
            "tenancy=$OCI_TENANCY_OCID" \
            "region=${{ vars.OCI_REGION }}" \
            "key_file=$HOME/.oci/oci_api_key.pem" \
            > "$HOME/.oci/config"
          chmod 0600 "$HOME/.oci/config"

      - name: Show remote state target
        run: |
          test -n "${{ vars.TF_STATE_BUCKET }}" || { echo "TF_STATE_BUCKET is not set"; exit 1; }
          test -n "${{ vars.OCI_NAMESPACE }}" || { echo "OCI_NAMESPACE is not set"; exit 1; }
          test -n "${{ vars.OCI_REGION }}" || { echo "OCI_REGION is not set"; exit 1; }
          printf 'State bucket: %s\nNamespace: %s\nRegion: %s\n' \
            '${{ vars.TF_STATE_BUCKET }}' \
            '${{ vars.OCI_NAMESPACE }}' \
            '${{ vars.OCI_REGION }}'

      - name: Check shared database configuration
        if: ${{ inputs.target == 'shared' || inputs.target == 'all' }}
        env:
          SHARED_POSTGRES_IMAGE_ID: ${{ vars.SHARED_POSTGRES_IMAGE_ID }}
          SHARED_POSTGRES_SSH_PUBLIC_KEY: ${{ vars.SHARED_POSTGRES_SSH_PUBLIC_KEY }}
          SHARED_POSTGRES_AVAILABILITY_DOMAIN: ${{ vars.SHARED_POSTGRES_AVAILABILITY_DOMAIN || vars.PERSONAL_OS_AVAILABILITY_DOMAIN }}
        run: |
          for name in SHARED_POSTGRES_IMAGE_ID SHARED_POSTGRES_SSH_PUBLIC_KEY SHARED_POSTGRES_AVAILABILITY_DOMAIN; do
            test -n "${!name}" || { echo "$name is not set"; exit 1; }
          done

      - name: Initialize shared state
        if: ${{ inputs.target == 'shared' || inputs.target == 'all' }}
        run: |
          terraform -chdir=environments/shared init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="key=shared/terraform.tfstate"

      - name: Plan shared infrastructure
        if: ${{ inputs.target == 'shared' || inputs.target == 'all' }}
        env:
          TF_VAR_tenancy_id: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_postgres_image_id: ${{ vars.SHARED_POSTGRES_IMAGE_ID }}
          TF_VAR_postgres_ssh_public_key: ${{ vars.SHARED_POSTGRES_SSH_PUBLIC_KEY }}
          TF_VAR_postgres_availability_domain: ${{ vars.SHARED_POSTGRES_AVAILABILITY_DOMAIN || vars.PERSONAL_OS_AVAILABILITY_DOMAIN }}
          TF_VAR_bastion_client_cidrs: ${{ vars.SHARED_BASTION_CLIENT_CIDRS || '[]' }}
          TF_VAR_legacy_autonomous_database_id: ${{ vars.SHARED_LEGACY_AUTONOMOUS_DATABASE_ID || 'null' }}
        run: |
          if [ "$TF_VAR_legacy_autonomous_database_id" = null ]; then
            unset TF_VAR_legacy_autonomous_database_id
          fi
          terraform -chdir=environments/shared plan -out=shared.tfplan

      - name: Apply shared infrastructure
        if: ${{ inputs.apply && (inputs.target == 'shared' || inputs.target == 'all') }}
        run: terraform -chdir=environments/shared apply -auto-approve shared.tfplan

      - name: Check Personal OS configuration
        if: ${{ inputs.target == 'personal-os' || inputs.target == 'all' }}
        env:
          PERSONAL_OS_KUBERNETES_VERSION: ${{ vars.PERSONAL_OS_KUBERNETES_VERSION }}
          PERSONAL_OS_NODE_IMAGE_ID: ${{ vars.PERSONAL_OS_NODE_IMAGE_ID }}
          PERSONAL_OS_AVAILABILITY_DOMAIN: ${{ vars.PERSONAL_OS_AVAILABILITY_DOMAIN }}
          PERSONAL_OS_ADMIN_CIDRS: ${{ vars.PERSONAL_OS_ADMIN_CIDRS }}
        run: |
          for name in PERSONAL_OS_KUBERNETES_VERSION PERSONAL_OS_NODE_IMAGE_ID PERSONAL_OS_AVAILABILITY_DOMAIN PERSONAL_OS_ADMIN_CIDRS; do
            test -n "${!name}" || { echo "$name is not set"; exit 1; }
          done

      - name: Initialize Personal OS state
        if: ${{ inputs.target == 'personal-os' || inputs.target == 'all' }}
        run: |
          terraform -chdir=environments/personal-os init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="key=personal-os/terraform.tfstate"

      - name: Plan Personal OS infrastructure
        if: ${{ inputs.target == 'personal-os' || inputs.target == 'all' }}
        env:
          TF_VAR_kubernetes_version: ${{ vars.PERSONAL_OS_KUBERNETES_VERSION }}
          TF_VAR_node_image_id: ${{ vars.PERSONAL_OS_NODE_IMAGE_ID }}
          TF_VAR_availability_domain: ${{ vars.PERSONAL_OS_AVAILABILITY_DOMAIN }}
          TF_VAR_admin_cidrs: ${{ vars.PERSONAL_OS_ADMIN_CIDRS }}
          TF_VAR_node_shape: ${{ vars.PERSONAL_OS_NODE_SHAPE || 'VM.Standard.A1.Flex' }}
          TF_VAR_node_ocpus: ${{ vars.PERSONAL_OS_NODE_OCPUS || '1' }}
          TF_VAR_node_memory_gbs: ${{ vars.PERSONAL_OS_NODE_MEMORY_GBS || '6' }}
          TF_VAR_node_count: ${{ vars.PERSONAL_OS_NODE_COUNT || '1' }}
        run: terraform -chdir=environments/personal-os plan -out=personal-os.tfplan

      - name: Apply Personal OS infrastructure
        if: ${{ inputs.apply && (inputs.target == 'personal-os' || inputs.target == 'all') }}
        run: terraform -chdir=environments/personal-os apply -auto-approve personal-os.tfplan

      - name: Publish Personal OS infrastructure details
        if: ${{ inputs.apply && (inputs.target == 'personal-os' || inputs.target == 'all') }}
        run: |
          echo "### Personal OS infrastructure" >> "$GITHUB_STEP_SUMMARY"
          echo "OKE cluster: $(terraform -chdir=environments/personal-os output -raw cluster_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Load balancer subnet: $(terraform -chdir=environments/personal-os output -raw load_balancer_subnet_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Load balancer NSG: $(terraform -chdir=environments/personal-os output -raw load_balancer_nsg_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "The application load balancer and HTTPS endpoint are created when the Kubernetes manifests are deployed." >> "$GITHUB_STEP_SUMMARY"

      - name: Check wedding configuration
        if: ${{ inputs.target == 'wedding' || inputs.target == 'all' }}
        env:
          WEDDING_KUBERNETES_VERSION: ${{ vars.WEDDING_KUBERNETES_VERSION }}
          WEDDING_NODE_IMAGE_ID: ${{ vars.WEDDING_NODE_IMAGE_ID }}
          WEDDING_AVAILABILITY_DOMAIN: ${{ vars.WEDDING_AVAILABILITY_DOMAIN }}
          WEDDING_ADMIN_CIDRS: ${{ vars.WEDDING_ADMIN_CIDRS }}
        run: |
          for name in WEDDING_KUBERNETES_VERSION WEDDING_NODE_IMAGE_ID WEDDING_AVAILABILITY_DOMAIN WEDDING_ADMIN_CIDRS; do
            test -n "${!name}" || { echo "$name is not set"; exit 1; }
          done

      - name: Initialize wedding state
        if: ${{ inputs.target == 'wedding' || inputs.target == 'all' }}
        run: |
          terraform -chdir=environments/wedding init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="key=wedding/terraform.tfstate"

      - name: Plan wedding infrastructure
        if: ${{ inputs.target == 'wedding' || inputs.target == 'all' }}
        env:
          TF_VAR_certificate_id: ${{ vars.OCI_CERTIFICATE_ID }}
          TF_VAR_kubernetes_version: ${{ vars.WEDDING_KUBERNETES_VERSION }}
          TF_VAR_node_image_id: ${{ vars.WEDDING_NODE_IMAGE_ID }}
          TF_VAR_availability_domain: ${{ vars.WEDDING_AVAILABILITY_DOMAIN }}
          TF_VAR_admin_cidrs: ${{ vars.WEDDING_ADMIN_CIDRS }}
          TF_VAR_node_shape: ${{ vars.WEDDING_NODE_SHAPE || 'VM.Standard.A1.Flex' }}
          TF_VAR_node_ocpus: ${{ vars.WEDDING_NODE_OCPUS || '1' }}
          TF_VAR_node_memory_gbs: ${{ vars.WEDDING_NODE_MEMORY_GBS || '6' }}
          TF_VAR_node_count: ${{ vars.WEDDING_NODE_COUNT || '1' }}
        run: terraform -chdir=environments/wedding plan -out=wedding.tfplan

      - name: Apply wedding infrastructure
        if: ${{ inputs.apply && (inputs.target == 'wedding' || inputs.target == 'all') }}
        run: terraform -chdir=environments/wedding apply -auto-approve wedding.tfplan

      - name: Publish wedding infrastructure details
        if: ${{ inputs.apply && (inputs.target == 'wedding' || inputs.target == 'all') }}
        run: |
          echo "### SG-Wedding infrastructure" >> "$GITHUB_STEP_SUMMARY"
          echo "Shared OKE cluster (owned by Personal OS): $(terraform -chdir=environments/wedding output -raw cluster_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Wedding worker pool: $(terraform -chdir=environments/wedding output -raw node_pool_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Load balancer subnet: $(terraform -chdir=environments/wedding output -raw load_balancer_subnet_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Load balancer NSG: $(terraform -chdir=environments/wedding output -raw load_balancer_nsg_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing placeholder: $(terraform -chdir=environments/wedding output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing gateway public IP: $(terraform -chdir=environments/wedding output -raw gateway_public_ip)" >> "$GITHUB_STEP_SUMMARY"
          echo "The new application load balancer and HTTPS endpoint are created when the Kubernetes manifests are deployed. Keep the placeholder until cutover is verified." >> "$GITHUB_STEP_SUMMARY"
