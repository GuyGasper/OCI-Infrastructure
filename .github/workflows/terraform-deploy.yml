name: Deploy OCI infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Infrastructure target"
        required: true
        type: choice
        default: personal-os
        options:
          - personal-os
          - wedding
          - shared
          - all
      apply:
        description: "Apply the plans (clear this for plan only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and optionally apply
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_id: ${{ vars.OCI_COMPARTMENT_ID }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_namespace: ${{ vars.OCI_NAMESPACE }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Configure OCI API credentials
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 0600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' \
            '[DEFAULT]' \
            "user=$OCI_USER_OCID" \
            "fingerprint=$OCI_FINGERPRINT" \
            "tenancy=$OCI_TENANCY_OCID" \
            "region=${{ vars.OCI_REGION }}" \
            "key_file=$HOME/.oci/oci_api_key.pem" \
            > "$HOME/.oci/config"
          chmod 0600 "$HOME/.oci/config"

      - name: Show remote state target
        run: |
          test -n "${{ vars.TF_STATE_BUCKET }}" || { echo "TF_STATE_BUCKET is not set"; exit 1; }
          test -n "${{ vars.OCI_NAMESPACE }}" || { echo "OCI_NAMESPACE is not set"; exit 1; }
          test -n "${{ vars.OCI_REGION }}" || { echo "OCI_REGION is not set"; exit 1; }
          printf 'State bucket: %s\nNamespace: %s\nRegion: %s\n' \
            '${{ vars.TF_STATE_BUCKET }}' \
            '${{ vars.OCI_NAMESPACE }}' \
            '${{ vars.OCI_REGION }}'

      - name: Initialize shared state
        if: ${{ inputs.target == 'shared' || inputs.target == 'all' }}
        run: |
          terraform -chdir=environments/shared init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="key=shared/terraform.tfstate"

      - name: Plan shared network
        if: ${{ inputs.target == 'shared' || inputs.target == 'all' }}
        run: terraform -chdir=environments/shared plan -out=shared.tfplan

      - name: Apply shared network
        if: ${{ inputs.apply && (inputs.target == 'shared' || inputs.target == 'all') }}
        run: terraform -chdir=environments/shared apply -auto-approve shared.tfplan

      - name: Initialize wedding state
        if: ${{ inputs.target == 'wedding' || inputs.target == 'all' }}
        run: |
          terraform -chdir=environments/wedding init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="key=wedding/terraform.tfstate"

      - name: Plan wedding site
        if: ${{ inputs.target == 'wedding' || inputs.target == 'all' }}
        env:
          TF_VAR_certificate_id: ${{ vars.OCI_CERTIFICATE_ID }}
        run: terraform -chdir=environments/wedding plan -out=wedding.tfplan

      - name: Apply wedding site
        if: ${{ inputs.apply && (inputs.target == 'wedding' || inputs.target == 'all') }}
        run: terraform -chdir=environments/wedding apply -auto-approve wedding.tfplan

      - name: Publish wedding URL
        if: ${{ inputs.apply && (inputs.target == 'wedding' || inputs.target == 'all') }}
        run: |
          echo "### Wedding: $(terraform -chdir=environments/wedding output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway public IP: $(terraform -chdir=environments/wedding output -raw gateway_public_ip)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Personal OS configuration
        if: ${{ inputs.target == 'personal-os' || inputs.target == 'all' }}
        run: |
          test -n "${{ vars.PERSONAL_OS_CERTIFICATE_ID }}" || { echo "PERSONAL_OS_CERTIFICATE_ID is not set"; exit 1; }

      - name: Initialize Personal OS state
        if: ${{ inputs.target == 'personal-os' || inputs.target == 'all' }}
        run: |
          terraform -chdir=environments/personal-os init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="key=personal-os/terraform.tfstate"

      - name: Plan Personal OS site
        if: ${{ inputs.target == 'personal-os' || inputs.target == 'all' }}
        env:
          TF_VAR_certificate_id: ${{ vars.PERSONAL_OS_CERTIFICATE_ID }}
        run: terraform -chdir=environments/personal-os plan -out=personal-os.tfplan

      - name: Apply Personal OS site
        if: ${{ inputs.apply && (inputs.target == 'personal-os' || inputs.target == 'all') }}
        run: terraform -chdir=environments/personal-os apply -auto-approve personal-os.tfplan

      - name: Publish Personal OS URL
        if: ${{ inputs.apply && (inputs.target == 'personal-os' || inputs.target == 'all') }}
        run: |
          echo "### Personal OS: $(terraform -chdir=environments/personal-os output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway public IP: $(terraform -chdir=environments/personal-os output -raw gateway_public_ip)" >> "$GITHUB_STEP_SUMMARY"
