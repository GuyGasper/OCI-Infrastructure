name: Terraform checks

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.hcl"
      - "**.tfvars.example"
      - "kubernetes/personal-os/**"
      - "scripts/render-personal-os.py"
      - ".github/workflows/terraform-*.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.hcl"
      - "**.tfvars.example"
      - "kubernetes/personal-os/**"
      - "scripts/render-personal-os.py"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read

jobs:
  check:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize shared without backend
        run: terraform -chdir=environments/shared init -backend=false -input=false

      - name: Validate shared
        run: terraform -chdir=environments/shared validate

      - name: Initialize wedding without backend
        run: terraform -chdir=environments/wedding init -backend=false -input=false

      - name: Validate wedding
        run: terraform -chdir=environments/wedding validate

      - name: Initialize Personal OS without backend
        run: terraform -chdir=environments/personal-os init -backend=false -input=false

      - name: Validate Personal OS
        run: terraform -chdir=environments/personal-os validate

      - name: Render Personal OS Kubernetes manifests
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/personal-os-tools"
          mkdir -p "$tools_dir"
          curl -fsSLo "$tools_dir/kubectl" https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          curl -fsSLo "$tools_dir/kubectl.sha256" https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$tools_dir/kubectl.sha256")  $tools_dir/kubectl" | sha256sum --check
          chmod +x "$tools_dir/kubectl"
          "$tools_dir/kubectl" kustomize kubernetes/personal-os > "$RUNNER_TEMP/personal-os-base.yaml"
          python3 scripts/render-personal-os.py --help
