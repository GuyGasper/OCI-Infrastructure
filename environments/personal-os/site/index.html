<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Personal OS</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { align-items: center; background: radial-gradient(circle at top, #243756, #101827 55%); color: #eef4ff; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 42rem; padding: 3rem 2rem; text-align: center; }
      h1 { font-size: clamp(3rem, 10vw, 6rem); letter-spacing: -.06em; margin: 0; }
      p { color: #a9bad3; font-size: 1.15rem; line-height: 1.7; }
      span { color: #73c7ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Personal <span>OS</span></h1>
      <p>A personal command center is taking shape.</p>
    </main>
  </body>
</html>
